global:
  port: 22
  timeout: 10
  concurrency: 10

groups:
  web:
    - host: 192.168.1.10
      port: 22
      user: admin
      password: "your-password"
    - host: 192.168.1.11
      user: admin
      private_key: "~/.ssh/id_rsa"
  
  db:
    - host: 192.168.1.20
      user: root
      password: "db-password"
    - host: 192.168.1.21
      user: root
      password: "db-password"

servers:
  - host: 192.168.1.100
    user: ubuntu
    private_key: "~/.ssh/id_rsa"
    tags:
      - production
      - monitoring